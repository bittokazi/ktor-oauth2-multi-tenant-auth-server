name: "Build Backend"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Change wrapper permissions
        run: chmod +x ./backend/gradlew

      - name: Build Frontend
        run: cd frontend && gradle buildFrontend --no-daemon && cd ../

      - name: Move cpanel.hbs into Backend
        run: mv frontend/build/dist/js/productionExecutable/index.html backend/src/main/resources/templates/cpanel.hbs

      - name: Move cpanel build into Backend
        run: cp -r frontend/build/dist/js/productionExecutable/app-static backend/src/main/resources/static/cpanel

      - name: Build Backend
        run: cd backend && gradle check buildFatJar --no-daemon && cd ../

  build-gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Change wrapper permissions
        run: chmod +x ./gateway/gradlew

      - name: Build Gateway
        run: cd gateway && gradle buildFatJar --no-daemon && cd ../
